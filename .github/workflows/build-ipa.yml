name: Build IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          swift --version

      - name: SDK diagnostics (AVCaptureDevice white balance API)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "== AVCaptureWhiteBalanceGains typedef =="
          grep -rn -A6 "AVCaptureWhiteBalanceGains" "$SDK/System/Library/Frameworks/AVFoundation.framework/Headers/" | head -40
          echo "== white balance methods =="
          grep -rn -i "whitebalance\|chromaticity\|temperatureAndTint" "$SDK/System/Library/Frameworks/AVFoundation.framework/Headers/AVCaptureDevice.h" | head -40
          echo "== swift interface =="
          echo 'import AVFoundation' > /tmp/probe.swift
          xcrun swift-api-digester -dump-sdk -module AVFoundation -o /tmp/avapi.json -swift-version 5 >/dev/null 2>&1 && python3 - <<'PY' || echo "api-digester unavailable"
          import json
          d = json.load(open('/tmp/avapi.json'))
          def walk(o):
              if isinstance(o, dict):
                  n = o.get('name', '')
                  if 'WhiteBalance' in n or 'whiteBalance' in n or 'hromaticity' in n:
                      print(n)
                  for v in o.values(): walk(v)
              elif isinstance(o, list):
                  for v in o: walk(v)
          walk(d)
          PY

      - name: Build (Release / iphoneos, unsigned)
        run: |
          xcodebuild build \
            -project OniichanCamera.xcodeproj \
            -scheme OniichanCamera \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/OniichanCamera.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry OniichanCamera.ipa Payload
          ls -lh OniichanCamera.ipa
          unzip -l OniichanCamera.ipa | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OniichanCamera-ipa
          path: OniichanCamera.ipa
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: OniichanCamera.ipa
          generate_release_notes: true
          name: OniichanCamera ${{ github.ref_name }}
