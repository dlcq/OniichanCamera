name: Build IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          swift --version

      - name: Build (Release / iphoneos, unsigned)
        run: |
          xcodebuild build \
            -project OniichanCamera.xcodeproj \
            -scheme OniichanCamera \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/OniichanCamera.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry OniichanCamera.ipa Payload
          ls -lh OniichanCamera.ipa
          unzip -l OniichanCamera.ipa | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OniichanCamera-ipa
          path: OniichanCamera.ipa
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: OniichanCamera.ipa
          generate_release_notes: true
          name: OniichanCamera ${{ github.ref_name }}
